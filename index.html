<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NĀDIRAH — Rare, always.</title>
<meta name="description" content="NĀDIRAH creates distinctive hand-beaded bags in limited quantities. Numbered pieces, made with intention.">
<meta property="og:title" content="NĀDIRAH — Rare, always.">
<meta property="og:description" content="Distinctive hand-beaded bags, made in limited quantities.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#111111">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   NĀDIRAH — Design Tokens & Typographic System
   ========================================================== */
:root {
  --black: #111111;
  --charcoal: #242424;
  --ivory: #F5F1EA;
  --champagne: #B9A88F;
  --ivory-soft: rgba(245, 241, 234, 0.68);
  --border-subtle: rgba(245, 241, 234, 0.12);

  --serif: "Cormorant Garamond", Garamond, "Times New Roman", serif;
  --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  /* Typographic Scales */
  --text-hero: clamp(2.5rem, 6.2vw, 5.5rem);      /* 40px - 88px */
  --text-h1: clamp(2.35rem, 5vw, 4.5rem);        /* 38px - 72px */
  --text-h2: clamp(1.75rem, 3.8vw, 3rem);        /* 28px - 48px */
  --text-h3: clamp(1.5rem, 2.5vw, 2.25rem);      /* 24px - 36px */
  --text-price: clamp(1rem, 1.25vw, 1.25rem);    /* 16px - 20px */
  --text-body: clamp(0.875rem, 1vw, 1rem);       /* 14px - 16px */
  --text-ui: 11px;
  --text-meta: 11px;

  /* Letter Spacing */
  --ls-wordmark: 0.12em;
  --ls-nav: 0.10em;
  --ls-meta: 0.14em;
  --ls-btn: 0.10em;
  --ls-headline: -0.015em;
  --ls-body: 0.005em;

  /* Line Heights */
  --lh-tight: 1.02;
  --lh-heading: 1.12;
  --lh-body: 1.72;
  --lh-ui: 1.3;

  --gutter: clamp(20px, 4.5vw, 72px);
  --header-h: 72px;
  --ease: cubic-bezier(.22,.61,.36,1);

  color-scheme: dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--header-h)); -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--black);
  color: var(--ivory);
  font-family: var(--sans);
  font-size: var(--text-body);
  line-height: var(--lh-body);
  letter-spacing: var(--ls-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, p, dl, dd, ul, figure { margin: 0; padding: 0; }
ul { list-style: none; }
:focus-visible { outline: 1px solid var(--ivory); outline-offset: 4px; }

.skip {
  position: absolute; left: -9999px; top: 0; background: var(--ivory); color: var(--black);
  padding: 12px 20px; z-index: 100; font-size: var(--text-ui); letter-spacing: var(--ls-btn);
  text-transform: uppercase; font-weight: 500;
}
.skip:focus { left: 16px; top: calc(env(safe-area-inset-top, 0px) + 16px); }

/* ---------- Typography Utilities ---------- */
.serif { font-family: var(--serif); font-weight: 400; }
.label {
  font-family: var(--sans);
  font-size: var(--text-meta);
  font-weight: 500;
  letter-spacing: var(--ls-meta);
  text-transform: uppercase;
  line-height: 1.4;
}
.label--soft { color: var(--ivory-soft); }
.display {
  font-family: var(--serif);
  font-size: var(--text-h1);
  font-weight: 400;
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-headline);
}
.lede {
  font-family: var(--sans);
  font-size: var(--text-body);
  color: var(--ivory-soft);
  line-height: var(--lh-body);
  max-width: 38em;
}

/* ---------- Buttons & Interactive ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 48px; padding: 0 2.4em;
  border: 1px solid var(--ivory);
  background: transparent;
  color: var(--ivory);
  font-family: var(--sans);
  font-size: var(--text-ui);
  font-weight: 500;
  letter-spacing: var(--ls-btn);
  text-transform: uppercase;
  transition: background-color .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease);
}
.btn:hover { background: var(--charcoal); border-color: var(--champagne); color: var(--ivory); }
.btn--solid { background: var(--ivory); color: var(--black); border-color: var(--ivory); }
.btn--solid:hover { background: var(--champagne); border-color: var(--champagne); color: var(--black); }

.link {
  font-family: var(--sans);
  font-size: var(--text-ui);
  font-weight: 500;
  letter-spacing: var(--ls-nav);
  text-transform: uppercase;
  display: inline-block;
  padding: 6px 0;
  background: linear-gradient(var(--champagne), var(--champagne)) 0 100% / 100% 1px no-repeat;
  transition: background-size .4s var(--ease), color .3s;
}
.link:hover { background-size: 0 1px; color: var(--ivory-soft); }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--black);
  border-bottom: 1px solid var(--border-subtle);
}
.site-header__in {
  height: var(--header-h);
  padding: 0 var(--gutter);
  display: flex; align-items: center; justify-content: space-between;
}
.wordmark {
  font-family: var(--serif);
  font-weight: 500;
  font-size: clamp(1.5rem, 2.2vw, 1.85rem); /* 24px - 30px */
  letter-spacing: var(--ls-wordmark);
  padding: 8px 0;
  color: var(--ivory);
}
.nav { display: none; gap: clamp(24px, 3.2vw, 48px); }
.nav a {
  font-family: var(--sans);
  font-size: var(--text-ui);
  font-weight: 500;
  letter-spacing: var(--ls-nav);
  text-transform: uppercase;
  padding: 10px 0;
  position: relative;
  color: var(--ivory);
}
.nav a::after {
  content: ""; position: absolute; left: 0; right: 100%; bottom: 6px;
  height: 1px; background: var(--champagne); transition: right .4s var(--ease);
}
.nav a:hover::after, .nav a[aria-current="page"]::after { right: 0; }
.menu-btn { width: 48px; height: 48px; margin-right: -12px; display: grid; place-items: center; }
.menu-btn span { display: block; width: 22px; height: 1px; background: var(--ivory); position: relative; }
.menu-btn span::before, .menu-btn span::after { content: ""; position: absolute; left: 0; width: 22px; height: 1px; background: var(--ivory); }
.menu-btn span::before { top: -6px; }
.menu-btn span::after { top: 6px; width: 15px; }
@media (min-width: 900px) { .nav { display: flex; } .menu-btn { display: none; } }

/* Drawer */
.drawer {
  position: fixed; inset: 0; z-index: 60; background: var(--black);
  padding: calc(env(safe-area-inset-top, 0px) + 14px) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 32px);
  display: flex; flex-direction: column;
  opacity: 0; visibility: hidden; transform: translateY(-8px);
  transition: opacity .4s var(--ease), transform .4s var(--ease), visibility 0s .4s;
}
.drawer.open { opacity: 1; visibility: visible; transform: none; }
.drawer__top { height: calc(var(--header-h) - 14px); display: flex; align-items: center; justify-content: space-between; }
.drawer__close { width: 48px; height: 48px; margin-right: -12px; position: relative; }
.drawer__close::before, .drawer__close::after { content: ""; position: absolute; left: 12px; top: 24px; width: 24px; height: 1px; background: var(--ivory); transform: rotate(45deg); }
.drawer__close::after { transform: rotate(-45deg); }
.drawer nav { margin-top: auto; margin-bottom: auto; display: flex; flex-direction: column; }
.drawer nav a { font-family: var(--serif); font-size: clamp(2rem, 8vw, 3rem); font-weight: 400; padding: 12px 0; color: var(--ivory); }
.drawer__foot { font-family: var(--sans); font-size: var(--text-ui); letter-spacing: var(--ls-meta); text-transform: uppercase; color: var(--ivory-soft); }

/* ---------- Layout & Structural Spacing ---------- */
main { outline: none; opacity: 0; transition: opacity .45s var(--ease); min-height: calc(100vh - var(--header-h) - 120px); }
main.in { opacity: 1; }
.wrap { padding: 0 var(--gutter); max-width: 1680px; margin: 0 auto; }
.page { padding-top: clamp(64px, 9vw, 128px); padding-bottom: clamp(96px, 12vw, 160px); }
.page__head { margin-bottom: clamp(48px, 6vw, 96px); }
.page__head .label { margin-bottom: 20px; display: block; }

/* Image Media & Placeholder */
.media { position: relative; background: var(--charcoal); overflow: hidden; border: 1px solid var(--border-subtle); }
.media img { width: 100%; height: 100%; object-fit: cover; opacity: 1; display: block; }
.ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; min-height: 380px; background: var(--charcoal); }
.ph span { font-size: var(--text-ui); letter-spacing: var(--ls-meta); text-transform: uppercase; color: var(--ivory-soft); }
.ph::before { content: ""; position: absolute; left: 50%; top: calc(50% - 24px); width: 1px; height: 12px; background: var(--champagne); }
.r-45 { aspect-ratio: 4 / 5; }

/* ---------- Homepage Hero (Strict Hierarchy) ---------- */
.hero {
  min-height: calc(100svh - var(--header-h) - env(safe-area-inset-top, 0px));
  display: grid;
  gap: 48px;
  padding-top: 32px;
  padding-bottom: clamp(64px, 8vw, 112px);
  align-items: center;
}
.hero__text {
  display: flex;
  flex-direction: column;
  justify-content: center;
  max-width: 42em;
}
.hero__brand { margin-bottom: 12px; color: var(--ivory); }
.hero__tag { margin-bottom: 24px; color: var(--champagne); }
.hero__name {
  font-family: var(--serif);
  font-weight: 400;
  font-size: var(--text-hero);
  line-height: var(--lh-tight);
  letter-spacing: var(--ls-headline);
  color: var(--ivory);
  margin-bottom: 28px;
}
.hero__sub {
  font-family: var(--sans);
  font-size: var(--text-body);
  color: var(--ivory-soft);
  line-height: var(--lh-body);
  max-width: 34em;
  margin-bottom: 40px;
}
.hero__sub p + p { margin-top: 14px; }
.hero__img { align-self: stretch; pointer-events: none; user-select: none; }
.hero__img .media { height: 100%; min-height: 500px; }

@media (min-width: 900px) {
  .hero { grid-template-columns: repeat(12, 1fr); column-gap: var(--gutter); padding-top: 40px; }
  .hero__text { grid-column: 1 / span 6; }
  .hero__img { grid-column: 8 / span 5; }
  .hero__img .media { min-height: 580px; }
}
@media (max-width: 899px) {
  .hero__img .media { aspect-ratio: 4 / 5; min-height: 0; height: auto; }
}

/* ---------- Product Page Typography & Layout ---------- */
.product {
  display: grid;
  gap: 40px;
  padding-top: 16px;
  padding-bottom: clamp(96px, 12vw, 160px);
}
.crumb { padding: 16px 0 24px; }
.gallery { display: flex; flex-direction: column; gap: 24px; }
.g-item { display: block; width: 100%; cursor: zoom-in; }
.g-item .media { width: 100%; }
.g-item:hover .media img { transform: scale(1.02); }
.g-count { display: none; }

.info { max-width: 32rem; }
.info__num { display: block; margin-bottom: 12px; color: var(--champagne); }
.info__name {
  font-family: var(--serif);
  font-weight: 400;
  font-size: var(--text-h2);
  line-height: var(--lh-heading);
  letter-spacing: var(--ls-headline);
  margin-bottom: 20px;
  color: var(--ivory);
}
.info__desc {
  font-family: var(--sans);
  font-size: var(--text-body);
  line-height: var(--lh-body);
  color: var(--ivory-soft);
  margin-bottom: 48px;
}

.details { border-top: 1px solid var(--border-subtle); margin-bottom: 48px; }
.details h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(1.5rem, 2vw, 1.85rem); /* 24px - 30px */
  letter-spacing: normal;
  text-transform: none;
  margin: 32px 0 16px;
  color: var(--ivory);
}
.details__row {
  padding: 18px 0;
  border-bottom: 1px solid var(--border-subtle);
  display: grid;
  grid-template-columns: 8.5em 1fr;
  gap: 16px;
}
.details dt {
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 500;
  color: var(--ivory);
}
.details dd {
  font-family: var(--sans);
  font-size: 13px;
  color: var(--ivory-soft);
  line-height: 1.6;
}

.buy__price {
  font-family: var(--sans);
  font-size: var(--text-price);
  font-weight: 500;
  margin-bottom: 24px;
  color: var(--ivory);
}
.buy .btn { min-width: 15rem; }
.buy__note { color: var(--ivory-soft); font-size: 13px; margin-top: 20px; max-width: 28em; line-height: 1.6; }
.buy__status { font-family: var(--serif); font-size: 1.4rem; color: var(--ivory-soft); margin-bottom: 24px; }

@media (min-width: 900px) {
  .product { grid-template-columns: repeat(12, 1fr); column-gap: var(--gutter); align-items: start; }
  .gallery { grid-column: 1 / span 7; }
  .info { grid-column: 9 / span 4; position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 32px); padding-top: 8px; }
  .crumb { grid-column: 1 / -1; }
}
@media (max-width: 899px) {
  .gallery {
    display: flex; flex-direction: row; overflow-x: auto; scroll-snap-type: x mandatory;
    gap: 12px; margin: 0 calc(var(--gutter) * -1); padding: 0 var(--gutter);
    scrollbar-width: none; scroll-padding: 0 var(--gutter);
  }
  .gallery::-webkit-scrollbar { display: none; }
  .g-item { flex: 0 0 86%; scroll-snap-align: start; }
  .g-item:nth-child(n) .media { aspect-ratio: 4 / 5; }
  .g-count { display: block; margin-top: -16px; }
  .info { padding-bottom: 96px; }
}

/* Sticky Claim Bar (Mobile) */
.claim-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--black); border-top: 1px solid var(--border-subtle);
  padding: 14px var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  transform: translateY(110%); transition: transform .45s var(--ease);
}
.claim-bar.show { transform: none; }
.claim-bar__price { font-family: var(--sans); font-size: 16px; font-weight: 500; color: var(--ivory); }
.claim-bar .btn { padding: 0 1.8em; }
@media (min-width: 900px) { .claim-bar { display: none; } }

/* ---------- Lightbox Modal ---------- */
dialog.lb { border: 0; padding: 0; margin: 0; width: 100%; height: 100%; max-width: none; max-height: none; background: rgba(17,17,17,.96); color: var(--ivory); }
dialog.lb::backdrop { background: rgba(17,17,17,.96); }
.lb__stage { position: absolute; inset: 72px 64px 72px; display: grid; place-items: center; }
.lb__frame { position: relative; height: 100%; max-width: 100%; aspect-ratio: 4 / 5; background: var(--charcoal); border: 1px solid var(--border-subtle); }
.lb__frame img { width: 100%; height: 100%; object-fit: contain; }
.lb__frame .ph span { color: var(--ivory-soft); }
.lb__cap { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); text-align: center; color: var(--ivory); }
.lb button.ctl { position: absolute; width: 48px; height: 48px; color: var(--ivory); display: grid; place-items: center; font-size: 11px; letter-spacing: var(--ls-btn); }
.lb .ctl--close { top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; }
.lb .ctl--prev { left: 8px; top: 50%; margin-top: -24px; }
.lb .ctl--next { right: 8px; top: 50%; margin-top: -24px; }
.lb .ctl svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1; }
.lb :focus-visible { outline-color: var(--ivory); }
@media (max-width: 600px) {
  .lb__stage { inset: 72px 12px 80px; }
  .lb .ctl--prev, .lb .ctl--next { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); margin: 0; }
}

.status { font-size: var(--text-meta); font-weight: 500; letter-spacing: var(--ls-meta); text-transform: uppercase; white-space: nowrap; }
.status--available::before { content: ""; display: inline-block; width: 14px; height: 1px; background: var(--champagne); vertical-align: middle; margin-right: 10px; }
.status--sold, .status--soon { color: var(--ivory-soft); }

/* ---------- Editorial Text Pages (Care, Contact) ---------- */
.prose p + p { margin-top: 1.5em; }
.prose p { font-family: var(--sans); font-size: var(--text-body); line-height: var(--lh-body); color: var(--ivory-soft); max-width: 38em; }
.prose .label { margin-top: 2.8em; margin-bottom: 0.8em; display: block; color: var(--ivory); }
.split { display: grid; gap: 48px; }
@media (min-width: 900px) {
  .split { grid-template-columns: repeat(12, 1fr); column-gap: var(--gutter); }
  .split > .a { grid-column: 1 / span 4; }
  .split > .b { grid-column: 6 / span 7; }
}
.contact-list { margin-top: 48px; border-top: 1px solid var(--border-subtle); }
.contact-list a {
  display: flex; justify-content: space-between; align-items: baseline; gap: 20px;
  padding: 24px 0; border-bottom: 1px solid var(--border-subtle);
  transition: padding-left .4s var(--ease); flex-wrap: wrap;
}
.contact-list a:hover { padding-left: 12px; }
.contact-list .n { font-family: var(--serif); font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 400; color: var(--ivory); }
.contact-list .v { font-family: var(--sans); color: var(--ivory-soft); font-size: 13px; }

/* ---------- Footer ---------- */
.site-footer {
  padding: 48px var(--gutter);
  border-top: 1px solid var(--border-subtle);
  max-width: 1680px; margin: 0 auto;
  background: var(--black);
}
.copy { font-family: var(--sans); font-size: var(--text-ui); color: var(--ivory-soft); letter-spacing: var(--ls-body); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  .media img { transform: none !important; }
}
</style>
</head>
<body data-tone="black">
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="site-header__in">
    <a class="wordmark" href="#/" aria-label="NĀDIRAH — home">NĀDIRAH</a>
    <nav class="nav" aria-label="Primary" id="nav"></nav>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer"><span></span></button>
  </div>
</header>

<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="true">
  <div class="drawer__top">
    <span class="wordmark">NĀDIRAH</span>
    <button class="drawer__close" id="drawerClose" aria-label="Close menu"></button>
  </div>
  <nav aria-label="Mobile" id="drawerNav"></nav>
  <p class="drawer__foot">Rare, always.</p>
</div>

<main id="main" tabindex="-1"></main>

<footer class="site-footer">
  <div class="copy">
    <span id="copy"></span>
  </div>
</footer>

<div class="claim-bar" id="claimBar" aria-hidden="true"></div>

<dialog class="lb" id="lb" aria-label="Image viewer">
  <button class="ctl ctl--close" id="lbClose" aria-label="Close image">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <button class="ctl ctl--prev" id="lbPrev" aria-label="Previous image">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg>
  </button>
  <button class="ctl ctl--next" id="lbNext" aria-label="Next image">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg>
  </button>
  <div class="lb__stage"><div class="lb__frame" id="lbFrame"></div></div>
  <p class="lb__cap label" id="lbCap" aria-live="polite"></p>
</dialog>

<script>
/* ==========================================================
   CONTENT & DATA
   ========================================================== */
const SITE = {
  name: "NĀDIRAH",
  tagline: "RARE, ALWAYS.",
  heroHeadline: "MADE TO BE DISTINCT.",
  heroImage: "bead.webp",
  heroIntro: "Distinctive hand-beaded bags, made in limited quantities.",
  currency: "₦",
  whatsapp: "234XXXXXXXXXX",
  email: "hello@nadirah.example",
  instagram: "https://instagram.com/nadirah",
  instagramHandle: "@nadirah",
  delivery: "Delivered within Nigeria in 3–5 working days. Each piece is sent in its dust bag."
};

const DEFAULT_DESC = "Hand-beaded for a lightweight, airy feel, with two thoughtfully designed compartments.";
const DEFAULT_DETAILS = [
  ["Hand-beaded", "Individually crafted by hand."],
  ["Lightweight", "Designed to feel easy to carry."],
  ["Airy", "Open beadwork creates a light, breathable feel."],
  ["Two compartments", "Designed for effortless organisation."]
];

const VIEWS = ["Front View", "Back View", "Side View"];
const slots = () => VIEWS.map(v => ({ src: "", label: v, alt: v.toLowerCase() }));

/* status: AVAILABLE | SOLD | COMING SOON */
const PRODUCTS = [
  { piece: "01", edition: "05", collection: "I", name: "ALBA", price: 0, status: "SOLD",        description: DEFAULT_DESC, details: DEFAULT_DETAILS, images: slots() },
  { piece: "02", edition: "05", collection: "I", name: "ALBA", price: 0, status: "AVAILABLE",   description: DEFAULT_DESC, details: DEFAULT_DETAILS, images: slots() },
  { piece: "03", edition: "05", collection: "I", name: "ALBA", price: 0, status: "COMING SOON", description: DEFAULT_DESC, details: DEFAULT_DETAILS, images: slots() },
  { piece: "04", edition: "05", collection: "I", name: "ALBA", price: 0, status: "COMING SOON", description: DEFAULT_DESC, details: DEFAULT_DETAILS, images: slots() },
  { piece: "05", edition: "05", collection: "I", name: "ALBA", price: 0, status: "COMING SOON", description: DEFAULT_DESC, details: DEFAULT_DETAILS, images: slots() }
];

const NAV = [
  ["Home", "#/"],
  ["Collection", "#/collection"],
  ["Care", "#/care"],
  ["Contact", "#/contact"]
];

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const price = p => p.price ? SITE.currency + Number(p.price).toLocaleString("en-NG") : SITE.currency + "XX,XXX";
const byPiece = n => PRODUCTS.find(p => p.piece === n || p.piece === "0" + parseInt(n, 10));
const pieceLabel = p => `EDITION 001 · PIECE ${p.piece} / ${p.edition} · ${p.status}`;
const wa = txt => `https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(txt)}`;
const claimUrl = p => wa(`Hello NĀDIRAH, I would like to claim Piece ${p.piece} / ${p.edition} — ${p.name}.`);

function media(img, cls, alt) {
  const ph = img && img.src ? "" : `<div class="ph" role="img" aria-label="Image placeholder: ${alt}"><span>${(img && img.label) || "Image"}</span></div>`;
  const tag = img && img.src ? `<img src="${img.src}" alt="${alt}">` : "";
  return `<div class="media ${cls}">${tag}${ph}</div>`;
}

/* ---------- Pages ---------- */
function home() {
  const heroMedia = { src: SITE.heroImage, label: "ALBA beadwork", alt: "NĀDIRAH hand-beaded details" };
  return `
  <section class="wrap hero" aria-label="Brand Introduction">
    <div class="hero__text">
      <span class="label hero__brand">${SITE.name}</span>
      <span class="label hero__tag">${SITE.tagline}</span>
      <h1 class="hero__name">${SITE.heroHeadline}</h1>
      <div class="hero__sub">
        <p>${SITE.heroIntro}</p>
      </div>
      <div><a class="btn btn--solid" href="#/collection">Explore the collection</a></div>
    </div>
    <div class="hero__img">
      ${media(heroMedia, "", "NĀDIRAH hand-beaded details")}
    </div>
  </section>`;
}

function piece(n) {
  const p = byPiece(n);
  if (!p) return notFound();
  const avail = p.status === "AVAILABLE";
  const gallery = p.images.map((img, i) => `
    <button class="g-item" data-i="${i}" aria-label="Enlarge image ${i + 1} of ${p.images.length}: ${img.label}">
      ${media(img, "r-45", `${p.name},${img.alt}`)}
    </button>`).join("");
  const details = p.details.map(d => `<div class="details__row"><dt>${d[0]}</dt><dd>${d[1]}</dd></div>`).join("");
  let buy;
  if (avail) {
    buy = `<div class="buy" id="buy">
      <p class="buy__price">${price(p)}</p>
      <a class="btn btn--solid" href="${claimUrl(p)}" target="_blank" rel="noopener">Claim this piece</a>
      <p class="buy__note">${SITE.delivery}</p>
    </div>`;
  } else if (p.status === "SOLD") {
    buy = `<div class="buy"><p class="buy__status">This piece has found its owner.</p><a class="link" href="#/">Back to home</a></div>`;
  } else {
    buy = `<div class="buy"><p class="buy__status">Coming soon.</p><a class="btn" href="mailto:${SITE.email}?subject=${encodeURIComponent("Enquiry: " + pieceLabel(p))}">Enquire</a></div>`;
  }
  return `
  <article class="wrap product" data-piece="${p.piece}">
    <div class="crumb"><a class="link" href="#/">← Home</a></div>
    <div>
      <div class="gallery" id="gallery" role="group" aria-label="Product images">${gallery}</div>
      <p class="g-count label label--soft" id="gCount" aria-hidden="true">1 / ${p.images.length}</p>
    </div>
    <div class="info">
      <span class="label info__num">${pieceLabel(p)}</span>
      <h1 class="info__name">${p.name}</h1>
      <p class="info__desc">${p.description}</p>
      <div class="details">
        <h2>The Details</h2>
        <dl>${details}</dl>
      </div>
      ${buy}
    </div>
  </article>`;
}

function care() {
  return `
  <section class="wrap page">
    <div class="split">
      <h1 class="a display">Care</h1>
      <div class="b prose">
        <p>Each NĀDIRAH piece is individually hand-beaded and deserves gentle care.</p>
        <p>Avoid excessive moisture, perfumes, and rough surfaces that may snag the beadwork. When not in use, store your bag in its dust bag in a cool, dry place.</p>
        
        <span class="label">Complimentary Repairs</span>
        <p>For the first six months after purchase, NĀDIRAH offers complimentary repairs for eligible accidental damage to your bag's beadwork or structure.</p>
        <p>Each request is assessed individually. Repairs are subject to inspection, and damage caused by misuse, neglect, or unauthorised alterations may not be covered.</p>
        <p>To request a repair, contact us with your proof of purchase and photographs of the damage.</p>
      </div>
    </div>
  </section>`;
}

function contact() {
  return `
  <section class="wrap page">
    <div class="split">
      <div class="a"><h1 class="display">Contact</h1></div>
      <div class="b">
        <p class="lede">For purchases, enquiries, or private orders:</p>
        <div class="contact-list">
          <a href="${wa("Hello NĀDIRAH,")}" target="_blank" rel="noopener"><span class="n">WhatsApp</span><span class="v">Message us</span></a>
          <a href="mailto:${SITE.email}"><span class="n">Email</span><span class="v">${SITE.email}</span></a>
          <a href="${SITE.instagram}" target="_blank" rel="noopener"><span class="n">Instagram</span><span class="v">${SITE.instagramHandle}</span></a>
        </div>
      </div>
    </div>
  </section>`;
}

function notFound() {
  return `<section class="wrap page"><h1 class="display">Not found</h1><p class="lede" style="margin-top:24px">This page doesn't exist. <a class="link" href="#/">Back to home</a></p></section>`;
}

/* ---------- Router ---------- */
const main = $("#main");
let currentProduct = null;
let barObserver = null;

function route() {
  const parts = (location.hash.replace(/^#\/?/, "") || "").split("/");
  const r = parts[0] || "home";
  let html, title = SITE.name, current = "";
  currentProduct = null;

  switch (r) {
    case "":
    case "home":
      html = home();
      title = `${SITE.name} — ${SITE.tagline}`;
      current = "#/";
      break;
    case "collection": {
      const p = PRODUCTS.find(prod => prod.status === "AVAILABLE") || PRODUCTS[0];
      html = piece(p.piece);
      currentProduct = p;
      title = `${p.name}, ${pieceLabel(p)} — ${SITE.name}`;
      current = "#/collection";
      break;
    }
    case "piece": {
      const p = byPiece(parts[1]);
      html = piece(parts[1]);
      if (p) {
        currentProduct = p;
        title = `${p.name}, ${pieceLabel(p)} — ${SITE.name}`;
      }
      current = "#/collection";
      break;
    }
    case "care":
      html = care();
      title = `Care — ${SITE.name}`;
      current = "#/care";
      break;
    case "contact":
      html = contact();
      title = `Contact — ${SITE.name}`;
      current = "#/contact";
      break;
    default:
      html = notFound();
      title = `Not found — ${SITE.name}`;
  }

  main.classList.remove("in");
  setTimeout(() => {
    main.innerHTML = html;
    document.title = title;
    document.body.dataset.tone = "black";
    document.querySelectorAll("#nav a").forEach(a => {
      if (a.getAttribute("href") === current) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    window.scrollTo(0, 0);
    closeDrawer(true);
    setupPiece();
    requestAnimationFrame(() => { main.classList.add("in"); });
    main.focus({ preventScroll: true });
  }, main.innerHTML ? 180 : 0);
}

/* ---------- Product Interactions ---------- */
function setupPiece() {
  const bar = $("#claimBar");
  if (barObserver) { barObserver.disconnect(); barObserver = null; }
  bar.classList.remove("show"); bar.setAttribute("aria-hidden", "true"); bar.innerHTML = "";
  if (!currentProduct) return;
  const p = currentProduct;

  const g = $("#gallery");
  if (g) {
    g.addEventListener("click", e => {
      const b = e.target.closest(".g-item");
      if (b) openLb(+b.dataset.i);
    });
    const counter = $("#gCount");
    g.addEventListener("scroll", () => {
      const first = g.firstElementChild;
      if (!first) return;
      const i = Math.round(g.scrollLeft / (first.offsetWidth + 12));
      counter.textContent = `${Math.min(i + 1, p.images.length)} / ${p.images.length}`;
    }, { passive: true });
  }

  if (p.status === "AVAILABLE") {
    bar.innerHTML = `<span class="claim-bar__price">${price(p)}</span><a class="btn btn--solid" href="${claimUrl(p)}" target="_blank" rel="noopener">Claim this piece</a>`;
    const target = $("#buy");
    if (target && "IntersectionObserver" in window) {
      barObserver = new IntersectionObserver(([e]) => {
        const show = !e.isIntersecting;
        bar.classList.toggle("show", show);
        bar.setAttribute("aria-hidden", show ? "false" : "true");
      }, { threshold: 0 });
      barObserver.observe(target);
    }
  }
}

/* ---------- Lightbox ---------- */
const lb = $("#lb");
let lbIndex = 0, lbTrigger = null;
function renderLb() {
  const p = currentProduct; if (!p) return;
  const img = p.images[lbIndex];
  $("#lbFrame").innerHTML = img.src
    ? `<img src="${img.src}" alt="${p.name}, ${img.alt}">`
    : `<div class="ph" role="img" aria-label="Image placeholder: ${img.label}"><span>${img.label}</span></div>`;
  $("#lbCap").textContent = `${img.label} · ${lbIndex + 1} / ${p.images.length}`;
}
function openLb(i) {
  lbIndex = i; lbTrigger = document.activeElement; renderLb();
  if (!lb.open) lb.showModal();
}
function stepLb(d) { const n = currentProduct.images.length; lbIndex = (lbIndex + d + n) % n; renderLb(); }
$("#lbClose").addEventListener("click", () => lb.close());
$("#lbPrev").addEventListener("click", () => stepLb(-1));
$("#lbNext").addEventListener("click", () => stepLb(1));
lb.addEventListener("close", () => { if (lbTrigger) lbTrigger.focus(); });
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
lb.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") stepLb(-1);
  if (e.key === "ArrowRight") stepLb(1);
});

/* ---------- Drawer ---------- */
const drawer = $("#drawer"), menuBtn = $("#menuBtn");
function openDrawer() {
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
  menuBtn.setAttribute("aria-expanded", "true");
  document.body.style.overflow = "hidden";
  $("#drawerClose").focus();
}
function closeDrawer(silent) {
  if (!drawer.classList.contains("open")) return;
  drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true");
  menuBtn.setAttribute("aria-expanded", "false");
  document.body.style.overflow = "";
  if (!silent) menuBtn.focus();
}
menuBtn.addEventListener("click", openDrawer);
$("#drawerClose").addEventListener("click", () => closeDrawer());
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
drawer.addEventListener("click", e => { if (e.target.closest("a")) closeDrawer(true); });

/* ---------- Boot ---------- */
const navHtml = (list) => list.map(([t, h]) => `<a href="${h}">${t}</a>`).join("");
$("#nav").innerHTML = navHtml(NAV);
$("#drawerNav").innerHTML = navHtml(NAV);
$("#copy").textContent = `© ${new Date().getFullYear()} ${SITE.name}. All rights reserved.`;
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
