<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NĀDIRAH — Rare, always.</title>
<meta name="description" content="NĀDIRAH creates distinctive hand-beaded bags in limited quantities. Numbered pieces, made with intention.">
<meta property="og:title" content="NĀDIRAH — Rare, always.">
<meta property="og:description" content="Distinctive hand-beaded bags, made in limited quantities.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F7F4EE">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   NĀDIRAH — design tokens
   Palette ratio: 70 ivory / 20 ink / 8 taupe / 2 accents
   ========================================================== */
:root {
  --ivory: #F7F4EE;
  --ink: #171717;
  --taupe: #E8E1D7;
  --espresso: #2A211C;
  --champagne: #B9A88F;
  --ink-soft: rgba(23,23,23,.62);

  --serif: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  --sans: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;

  --gutter: clamp(20px, 4.5vw, 72px);
  --header-h: 68px;
  --ease: cubic-bezier(.22,.61,.36,1);

  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--header-h)); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ivory);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  transition: background-color .5s var(--ease);
}
body[data-tone="taupe"] { background: var(--taupe); }
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, p, dl, dd, ul, figure { margin: 0; padding: 0; }
ul { list-style: none; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
.skip { position: absolute; left: -9999px; top: 0; background: var(--ink); color: var(--ivory); padding: 12px 18px; z-index: 100; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
.skip:focus { left: 12px; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- type ---------- */
.label { font-family: var(--sans); font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; }
.label--soft { color: var(--ink-soft); }
.serif { font-family: var(--serif); font-weight: 400; }
.display { font-family: var(--serif); font-weight: 300; line-height: 1.02; letter-spacing: -.005em; font-size: clamp(2.6rem, 6vw, 5.2rem); }
.lede { font-family: var(--serif); font-weight: 400; font-size: clamp(1.35rem, 2.1vw, 1.75rem); line-height: 1.5; max-width: 34em; }
.measure { max-width: 34em; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 48px; padding: 0 2.6em;
  border: 1px solid var(--ink);
  font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase;
  transition: background-color .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease);
}
.btn:hover { background: var(--ink); color: var(--ivory); }
.btn--solid { background: var(--ink); color: var(--ivory); }
.btn--solid:hover { background: var(--espresso); border-color: var(--espresso); }
.link {
  font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase;
  display: inline-block; padding: 6px 0;
  background: linear-gradient(var(--champagne), var(--champagne)) 0 100% / 100% 1px no-repeat;
  transition: background-size .4s var(--ease), color .3s;
}
.link:hover { background-size: 0 1px; background-position: 100% 100%; }

/* ---------- header ---------- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--ivory);
  transition: background-color .5s var(--ease);
}
body[data-tone="taupe"] .site-header { background: var(--taupe); }
.site-header__in {
  height: var(--header-h);
  padding: 0 var(--gutter);
  display: flex; align-items: center; justify-content: space-between;
}
.wordmark { font-family: var(--serif); font-weight: 500; font-size: 1.35rem; letter-spacing: .34em; padding: 8px 0; }
.nav { display: none; gap: clamp(28px, 3.6vw, 56px); }
.nav a { font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; padding: 10px 0; position: relative; }
.nav a::after { content: ""; position: absolute; left: 0; right: 100%; bottom: 6px; height: 1px; background: var(--champagne); transition: right .4s var(--ease); }
.nav a:hover::after, .nav a[aria-current="page"]::after { right: 0; }
.menu-btn { width: 48px; height: 48px; margin-right: -12px; display: grid; place-items: center; }
.menu-btn span { display: block; width: 24px; height: 1px; background: var(--ink); position: relative; }
.menu-btn span::before, .menu-btn span::after { content: ""; position: absolute; left: 0; width: 24px; height: 1px; background: var(--ink); }
.menu-btn span::before { top: -6px; }
.menu-btn span::after { top: 6px; width: 16px; }
@media (min-width: 900px) { .nav { display: flex; } .menu-btn { display: none; } }

/* drawer */
.drawer {
  position: fixed; inset: 0; z-index: 60; background: var(--ivory);
  padding: calc(env(safe-area-inset-top, 0px) + 14px) var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 32px);
  display: flex; flex-direction: column;
  opacity: 0; visibility: hidden; transform: translateY(-8px);
  transition: opacity .4s var(--ease), transform .4s var(--ease), visibility 0s .4s;
}
.drawer.open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
.drawer__top { height: calc(var(--header-h) - 14px); display: flex; align-items: center; justify-content: space-between; }
.drawer__close { width: 48px; height: 48px; margin-right: -12px; position: relative; }
.drawer__close::before, .drawer__close::after { content: ""; position: absolute; left: 12px; top: 24px; width: 24px; height: 1px; background: var(--ink); transform: rotate(45deg); }
.drawer__close::after { transform: rotate(-45deg); }
.drawer nav { margin-top: auto; margin-bottom: auto; display: flex; flex-direction: column; }
.drawer nav a { font-family: var(--serif); font-size: clamp(2.2rem, 9vw, 3rem); font-weight: 300; padding: 10px 0; letter-spacing: .02em; }
.drawer__foot { font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--ink-soft); }

/* ---------- layout ---------- */
main { outline: none; opacity: 0; transition: opacity .45s var(--ease); min-height: calc(100vh - var(--header-h) - 240px); }
main.in { opacity: 1; }
.wrap { padding: 0 var(--gutter); max-width: 1680px; margin: 0 auto; }
.page { padding-top: clamp(56px, 10vw, 140px); padding-bottom: clamp(88px, 14vw, 200px); }
.page__head { margin-bottom: clamp(56px, 8vw, 120px); }
.page__head .label { margin-bottom: 20px; display: block; }

/* image / placeholder */
.media { position: relative; background: var(--taupe); overflow: hidden; }
body[data-tone="taupe"] .media { background: #DCD3C6; }
.media img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .9s var(--ease), transform 1.4s var(--ease); }
.media img.loaded { opacity: 1; }
.ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
.ph span { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-soft); }
.ph::before { content: ""; position: absolute; left: 50%; top: calc(50% - 26px); width: 1px; height: 14px; background: var(--champagne); }
.r-45 { aspect-ratio: 4 / 5; }
.r-32 { aspect-ratio: 3 / 2; }

/* ---------- home ---------- */
.hero { min-height: calc(100svh - var(--header-h) - env(safe-area-inset-top, 0px)); display: grid; gap: 40px; padding-top: 24px; padding-bottom: clamp(56px, 8vw, 96px); }
.hero__text { display: flex; flex-direction: column; justify-content: flex-end; gap: 0; }
.hero__name { font-family: var(--serif); font-weight: 300; font-size: clamp(3rem, 12.5vw, 6.6rem); letter-spacing: .12em; line-height: 1; margin-left: -.04em; }
.hero__tag { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: clamp(1.6rem, 3vw, 2.4rem); margin-top: 18px; letter-spacing: .04em; }
.hero__line { width: 40px; height: 1px; background: var(--champagne); margin: 36px 0 24px; }
.hero__sub { max-width: 22em; color: var(--ink-soft); margin-bottom: 40px; }
.hero__img { align-self: stretch; }
.hero__img .media { height: 100%; min-height: 520px; }
.hero__img a { display: block; height: 100%; }
a:hover > .media img, .card:hover .media img { transform: scale(1.025); }
@media (min-width: 900px) {
  .hero { grid-template-columns: repeat(12, 1fr); column-gap: var(--gutter); padding-top: 32px; }
  .hero__text { grid-column: 1 / span 5; }
  .hero__img { grid-column: 7 / span 6; }
  .hero__img .media { min-height: 0; }
}
@media (max-width: 899px) { .hero__img .media { aspect-ratio: 4 / 5; min-height: 0; height: auto; } }

/* ---------- collection ---------- */
.grid { display: grid; gap: 72px var(--gutter); }
@media (min-width: 720px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
  .grid > :nth-child(even) { margin-top: 120px; }
}
.card { display: block; }
.card .media { margin-bottom: 26px; }
.card__meta { margin-bottom: 8px; }
.card__name { font-family: var(--serif); font-weight: 400; font-size: clamp(1.9rem, 3vw, 2.5rem); line-height: 1.1; margin-bottom: 14px; }
.card__desc { color: var(--ink-soft); max-width: 26em; margin-bottom: 18px; }
.card__price { font-family: var(--serif); font-size: 1.4rem; margin-bottom: 22px; }
.empty { font-family: var(--serif); font-size: 1.5rem; color: var(--ink-soft); }

/* ---------- product ---------- */
.product { display: grid; gap: 40px; padding-top: 8px; padding-bottom: clamp(88px, 12vw, 180px); }
.crumb { padding: 20px 0 8px; }
.gallery { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.g-item { display: block; width: 100%; cursor: zoom-in; }
.g-item .media { width: 100%; }
.g-item:nth-child(1), .g-item:nth-child(4) { grid-column: 1 / -1; }
.g-item:nth-child(4) .media { aspect-ratio: 3 / 2; }
.g-item:hover .media img { transform: scale(1.02); }
.g-count { display: none; }
.info { max-width: 30rem; }
.info__num { display: block; margin-bottom: 18px; }
.info__name { font-family: var(--serif); font-weight: 300; font-size: clamp(2.6rem, 5vw, 4rem); line-height: 1.02; margin-bottom: 24px; }
.info__desc { font-family: var(--serif); font-size: 1.35rem; line-height: 1.5; margin-bottom: 48px; }
.details { border-top: 1px solid rgba(23,23,23,.14); margin-bottom: 48px; }
.details h2 { margin: 28px 0 8px; }
.details__row { padding: 18px 0; border-bottom: 1px solid rgba(23,23,23,.14); display: grid; grid-template-columns: 8.5em 1fr; gap: 16px; }
.details dt { font-family: var(--serif); font-size: 1.25rem; line-height: 1.3; }
.details dd { color: var(--ink-soft); }
.buy__price { font-family: var(--serif); font-size: 1.9rem; margin-bottom: 22px; }
.buy .btn { min-width: 15rem; }
.buy__note { color: var(--ink-soft); font-size: 13px; margin-top: 22px; max-width: 26em; }
.buy__status { font-family: var(--serif); font-size: 1.4rem; color: var(--ink-soft); margin-bottom: 22px; }
@media (min-width: 900px) {
  .product { grid-template-columns: repeat(12, 1fr); column-gap: var(--gutter); align-items: start; }
  .gallery { grid-column: 1 / span 7; }
  .info { grid-column: 9 / span 4; position: sticky; top: calc(var(--header-h) + env(safe-area-inset-top, 0px) + 32px); padding-top: 8px; }
  .crumb { grid-column: 1 / -1; }
}
@media (max-width: 899px) {
  .gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 8px; margin: 0 calc(var(--gutter) * -1); padding: 0 var(--gutter); scrollbar-width: none; scroll-padding: 0 var(--gutter); }
  .gallery::-webkit-scrollbar { display: none; }
  .g-item { flex: 0 0 88%; scroll-snap-align: start; }
  .g-item:nth-child(n) .media { aspect-ratio: 4 / 5; }
  .g-count { display: block; margin-top: -16px; }
  .info { padding-bottom: 96px; }
}
/* sticky mobile claim bar */
.claim-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  background: var(--ivory); border-top: 1px solid rgba(23,23,23,.12);
  padding: 12px var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 12px);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  transform: translateY(110%); transition: transform .45s var(--ease);
}
.claim-bar.show { transform: none; }
.claim-bar__price { font-family: var(--serif); font-size: 1.5rem; }
.claim-bar .btn { padding: 0 1.8em; }
@media (min-width: 900px) { .claim-bar { display: none; } }

/* ---------- lightbox ---------- */
dialog.lb { border: 0; padding: 0; margin: 0; width: 100%; height: 100%; max-width: none; max-height: none; background: rgba(42,33,28,.96); color: var(--ivory); }
dialog.lb::backdrop { background: rgba(42,33,28,.96); }
.lb__stage { position: absolute; inset: 72px 64px 72px; display: grid; place-items: center; }
.lb__frame { position: relative; height: 100%; max-width: 100%; aspect-ratio: 4 / 5; background: #3a2f28; }
.lb__frame img { width: 100%; height: 100%; object-fit: contain; }
.lb__frame .ph span { color: rgba(247,244,238,.6); }
.lb__cap { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); text-align: center; }
.lb button.ctl { position: absolute; width: 48px; height: 48px; color: var(--ivory); display: grid; place-items: center; font-size: 11px; letter-spacing: .2em; }
.lb .ctl--close { top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; }
.lb .ctl--prev { left: 6px; top: 50%; margin-top: -24px; }
.lb .ctl--next { right: 6px; top: 50%; margin-top: -24px; }
.lb .ctl svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1; }
.lb :focus-visible { outline-color: var(--ivory); }
@media (max-width: 600px) { .lb__stage { inset: 72px 8px 80px; } .lb .ctl--prev, .lb .ctl--next { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); margin: 0; } }

/* ---------- archive ---------- */
.archive { display: grid; gap: 64px var(--gutter); }
@media (min-width: 720px) { .archive { grid-template-columns: repeat(3, 1fr); } .archive > :nth-child(3n+2) { margin-top: 72px; } }
.a-item { display: block; }
.a-item .media { margin-bottom: 20px; }
.a-item__row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-top: 1px solid rgba(23,23,23,.2); padding-top: 14px; }
.a-item__name { font-family: var(--serif); font-size: 1.6rem; line-height: 1.15; margin-top: 10px; }
.a-item--sold .media img { filter: saturate(.7); }
.status { font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; white-space: nowrap; }
.status--available::before { content: ""; display: inline-block; width: 14px; height: 1px; background: var(--champagne); vertical-align: middle; margin-right: 10px; }
.status--sold, .status--soon { color: var(--ink-soft); }

/* ---------- text pages ---------- */
.prose p + p { margin-top: 1.4em; }
.prose p { font-family: var(--serif); font-size: clamp(1.4rem, 2.3vw, 1.9rem); line-height: 1.5; }
.sign { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: clamp(2rem, 4vw, 3.2rem); margin-top: clamp(56px, 8vw, 96px); letter-spacing: .04em; }
.split { display: grid; gap: 40px; }
@media (min-width: 900px) { .split { grid-template-columns: repeat(12, 1fr); column-gap: var(--gutter); } .split > .a { grid-column: 1 / span 4; } .split > .b { grid-column: 6 / span 6; } }
.contact-list { margin-top: 56px; border-top: 1px solid rgba(23,23,23,.2); }
.contact-list a { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 26px 0; border-bottom: 1px solid rgba(23,23,23,.2); transition: padding-left .4s var(--ease); flex-wrap: wrap; }
.contact-list a:hover { padding-left: 12px; }
.contact-list .n { font-family: var(--serif); font-size: clamp(1.8rem, 3.4vw, 2.6rem); font-weight: 300; }
.contact-list .v { color: var(--ink-soft); font-size: 13px; }

/* ---------- footer ---------- */
.site-footer { padding: clamp(56px, 8vw, 96px) var(--gutter) 40px; border-top: 1px solid rgba(23,23,23,.12); max-width: 1680px; margin: 0 auto; }
.site-footer__grid { display: grid; gap: 40px; }
@media (min-width: 720px) { .site-footer__grid { grid-template-columns: 1fr auto; align-items: end; } }
.foot-brand .wordmark { display: inline-block; padding: 0; }
.foot-brand p { font-family: var(--serif); font-style: italic; font-size: 1.2rem; margin-top: 6px; }
.foot-nav { display: flex; flex-wrap: wrap; gap: 4px 28px; }
.foot-nav a { font-size: 11px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; padding: 10px 0; }
.foot-nav a:hover { color: var(--ink-soft); }
.copy { margin-top: 48px; font-size: 12px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.copy a:hover { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  .media img { transform: none !important; }
}
</style>
</head>
<body data-tone="ivory">
<a class="skip" href="#main">Skip to content</a>

<header class="site-header">
  <div class="site-header__in">
    <a class="wordmark" href="#/" aria-label="NĀDIRAH — home">NĀDIRAH</a>
    <nav class="nav" aria-label="Primary" id="nav"></nav>
    <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer"><span></span></button>
  </div>
</header>

<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="true">
  <div class="drawer__top">
    <span class="wordmark">NĀDIRAH</span>
    <button class="drawer__close" id="drawerClose" aria-label="Close menu"></button>
  </div>
  <nav aria-label="Mobile" id="drawerNav"></nav>
  <p class="drawer__foot">Rare, always.</p>
</div>

<main id="main" tabindex="-1"></main>

<footer class="site-footer">
  <div class="site-footer__grid">

<script>
/* ==========================================================
   CONTENT & DATA — edit here. Everything on the site reads
   from SITE and PRODUCTS. Add a product = add an object.
   ========================================================== */
const SITE = {
  name: "NĀDIRAH",
  tagline: "Rare, always.",
  intro: "Distinctive hand-beaded bags, made in limited quantities.",
  currency: "₦",
  whatsapp: "234XXXXXXXXXX",            // international format, digits only
  email: "hello@nadirah.example",
  instagram: "https://instagram.com/nadirah",
  instagramHandle: "@nadirah",
  delivery: "Delivered within Nigeria in 3–5 working days. Each piece is sent in its dust bag."
};

const DEFAULT_DESC = "Hand-beaded for a lightweight, airy feel, with two thoughtfully designed compartments.";
const DEFAULT_DETAILS = [
  ["Hand-beaded", "Individually crafted by hand."],
  ["Lightweight", "Designed to feel easy to carry."],
  ["Airy", "Open beadwork creates a light, breathable feel."],
  ["Two compartments", "Designed for effortless organisation."]
];
/* Image slots. Set `src` to a real file/URL to replace a placeholder; `alt` should then describe the photograph. */
const VIEWS = ["Front", "Back", "Side", "Close-up", "Interior", "Carrying"];
const slots = () => VIEWS.map(v => ({ src: "", label: v, alt: v.toLowerCase() + " view" }));

/* status: AVAILABLE | SOLD | COMING SOON */
const PRODUCTS = [
  { piece: "001", edition: "005", collection: "I", name: "[Bag Name]", price: 0, status: "SOLD",        description: DEFAULT_DESC, details: DEFAULT_DETAILS, images: slots() },
  { piece: "002", edition: "005", collection: "I", name: "[Bag Name]", price: 0, status: "AVAILABLE",   description: DEFAULT_DESC, details: DEFAULT_DETAILS, images: slots() },
  { piece: "003", edition: "005", collection: "I", name: "[Bag Name]", price: 0, status: "COMING SOON", description: DEFAULT_DESC, details: DEFAULT_DETAILS, images: slots() },
  { piece: "004", edition: "005", collection: "I", name: "[Bag Name]", price: 0, status: "COMING SOON", description: DEFAULT_DESC, details: DEFAULT_DETAILS, images: slots() },
  { piece: "005", edition: "005", collection: "I", name: "[Bag Name]", price: 0, status: "COMING SOON", description: DEFAULT_DESC, details: DEFAULT_DETAILS, images: slots() }
];

const NAV = [
  ["Collection", "#/collection"],
  ["Archive", "#/archive"],
  ["About", "#/about"],
  ["Care", "#/care"]
];
const FOOT = NAV.concat([["Contact", "#/contact"]]);

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const price = p => p.price ? SITE.currency + Number(p.price).toLocaleString("en-NG") : SITE.currency + "XX,XXX";
const statusKey = p => p.status === "AVAILABLE" ? "available" : p.status === "SOLD" ? "sold" : "soon";
const byPiece = n => PRODUCTS.find(p => p.piece === n);
const pieceLabel = p => `Piece ${p.piece} / ${p.edition}`;
const wa = txt => `https://wa.me/${SITE.whatsapp}?text=${encodeURIComponent(txt)}`;
const claimUrl = p => wa(`Hello NĀDIRAH, I would like to claim Piece ${p.piece} / ${p.edition} — ${p.name}.`);

function media(img, cls, alt, eager) {
  const ph = img && img.src ? "" : `<div class="ph" role="img" aria-label="Image placeholder: ${alt}"><span>${(img && img.label) || "Image"}</span></div>`;
  const tag = img && img.src ? `<img src="${img.src}" alt="${alt}" ${eager ? "" : 'loading="lazy"'} decoding="async" onload="this.classList.add('loaded')">` : "";
  return `<div class="media ${cls}">${tag}${ph}</div>`;
}

/* ---------- pages ---------- */
function home() {
  const feat = PRODUCTS.find(p => p.status === "AVAILABLE") || PRODUCTS[0];
  const cover = feat.images[0];
  return `
  <section class="wrap hero" aria-label="Introduction">
    <div class="hero__text">
      <h1 class="hero__name">${SITE.name}</h1>
      <p class="hero__tag">${SITE.tagline}</p>
      <div class="hero__line" aria-hidden="true"></div>
      <p class="hero__sub">${SITE.intro}</p>
      <div><a class="btn" href="#/collection">Shop the collection</a></div>
    </div>
    <div class="hero__img">
      <a href="#/piece/${feat.piece}" aria-label="View ${pieceLabel(feat)}, ${feat.name}">
        ${media(cover, "", `${feat.name}, front view`, true)}
      </a>
    </div>
  </section>`;
}

function card(p) {
  const showPrice = p.status === "AVAILABLE";
  return `
  <a class="card" href="#/piece/${p.piece}">
    ${media(p.images[0], "r-45", `${p.name}, front view`)}
    <p class="label label--soft card__meta">${pieceLabel(p)}</p>
    <h2 class="card__name">${p.name}</h2>
    <p class="card__desc">${p.description}</p>
    ${showPrice ? `<p class="card__price">${price(p)}</p>` : `<p class="status status--${statusKey(p)}" style="margin-bottom:22px">${p.status}</p>`}
    <span class="link">View piece</span>
  </a>`;
}

function collection() {
  const list = PRODUCTS.filter(p => p.status !== "SOLD");
  return `
  <section class="wrap page">
    <header class="page__head">
      <h1 class="display">The Collection</h1>
    </header>
    ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<p class="empty">The next piece is in the making.</p>`}
    <p style="margin-top:96px"><a class="link" href="#/archive">See the archive</a></p>
  </section>`;
}

function piece(n) {
  const p = byPiece(n);
  if (!p) return notFound();
  const avail = p.status === "AVAILABLE";
  const gallery = p.images.map((img, i) => `
    <button class="g-item" data-i="${i}" aria-label="Enlarge image ${i + 1} of ${p.images.length}: ${img.label}">
      ${media(img, "r-45", `${p.name}, ${img.alt}`, i < 2)}
    </button>`).join("");
  const details = p.details.map(d => `<div class="details__row"><dt>${d[0]}</dt><dd>${d[1]}</dd></div>`).join("");
  let buy;
  if (avail) {
    buy = `<div class="buy" id="buy">
      <p class="buy__price">${price(p)}</p>
      <a class="btn btn--solid" href="${claimUrl(p)}" target="_blank" rel="noopener">Claim this piece</a>
      <p class="buy__note">${SITE.delivery}</p>
    </div>`;
  } else if (p.status === "SOLD") {
    buy = `<div class="buy"><p class="buy__status">This piece has found its owner.</p><a class="link" href="#/collection">View the collection</a></div>`;
  } else {
    buy = `<div class="buy"><p class="buy__status">Coming soon.</p><a class="btn" href="mailto:${SITE.email}?subject=${encodeURIComponent("Enquiry: " + pieceLabel(p))}">Enquire</a></div>`;
  }
  return `
  <article class="wrap product" data-piece="${p.piece}">
    <div class="crumb"><a class="link" href="#/collection">Collection</a></div>
    <div>
      <div class="gallery" id="gallery" role="group" aria-label="Product images">${gallery}</div>
      <p class="g-count label label--soft" id="gCount" aria-hidden="true">1 / ${p.images.length}</p>
    </div>
    <div class="info">
      <span class="label label--soft info__num">${pieceLabel(p)}</span>
      <h1 class="info__name">${p.name}</h1>
      <p class="info__desc">${p.description}</p>
      <div class="details">
        <h2 class="label">The Details</h2>
        <dl>${details}</dl>
      </div>
      ${buy}
    </div>
  </article>`;
}

function archive() {
  const items = PRODUCTS.map(p => `
  <a class="a-item a-item--${statusKey(p)}" href="#/piece/${p.piece}">
    ${media(p.images[0], "r-45", `${p.name}, front view`)}
    <div class="a-item__row">
      <span class="label">${p.piece} / ${p.edition}</span>
      <span class="status status--${statusKey(p)}">${p.status}</span>
    </div>
    <p class="a-item__name">${p.name}</p>
  </a>`).join("");
  return `
  <section class="wrap page">
    <header class="page__head">
      <h1 class="display">The Archive</h1>
      <p class="lede" style="margin-top:28px">Every numbered piece has a place in the history of NĀDIRAH.</p>
    </header>
    <div class="archive">${items}</div>
  </section>`;
}

function about() {
  return `
  <section class="wrap page">
    <div class="split">
      <h1 class="a display">About NĀDIRAH</h1>
      <div class="b prose">
        <p>NĀDIRAH creates distinctive hand-beaded bags in limited quantities, designed for those who appreciate pieces that feel rare, considered, and individual.</p>
        <p>Each piece is made with intention, in small numbers, and designed to become part of its owner's collection.</p>
        <p class="sign">Rare, always.</p>
      </div>
    </div>
  </section>`;
}

function care() {
  return `
  <section class="wrap page">
    <div class="split">
      <h1 class="a display">Care</h1>
      <div class="b prose">
        <p>Your NĀDIRAH piece is individually made and should be handled with care.</p>
        <p>Store in its dust bag when not in use. Keep away from excessive moisture, rough surfaces, and anything that may catch or pull the beadwork.</p>
      </div>
    </div>
  </section>`;
}

function contact() {
  return `
  <section class="wrap page">
    <div class="split">
      <div class="a"><h1 class="display">Contact</h1></div>
      <div class="b">
        <p class="lede">For purchases, enquiries, or private orders:</p>
        <div class="contact-list">
          <a href="${wa("Hello NĀDIRAH,")}" target="_blank" rel="noopener"><span class="n">WhatsApp</span><span class="v">Message us</span></a>
          <a href="mailto:${SITE.email}"><span class="n">Email</span><span class="v">${SITE.email}</span></a>
          <a href="${SITE.instagram}" target="_blank" rel="noopener"><span class="n">Instagram</span><span class="v">${SITE.instagramHandle}</span></a>
        </div>
      </div>
    </div>
  </section>`;
}

function notFound() {
  return `<section class="wrap page"><h1 class="display">Not found</h1><p class="lede" style="margin-top:24px">This page doesn't exist. <a class="link" href="#/collection">View the collection</a></p></section>`;
}

/* ---------- router ---------- */
const main = $("#main");
let currentProduct = null;
let barObserver = null;

function route() {
  const parts = (location.hash.replace(/^#\/?/, "") || "").split("/");
  const r = parts[0] || "home";
  let html, title = SITE.name, tone = "ivory", current = "";
  currentProduct = null;

  switch (r) {
    case "home": html = home(); title = `${SITE.name} — ${SITE.tagline}`; break;
    case "collection": html = collection(); title = `The Collection — ${SITE.name}`; current = "#/collection"; break;
    case "piece": {
      const p = byPiece(parts[1]);
      html = piece(parts[1]);
      if (p) { currentProduct = p; title = `${p.name}, ${pieceLabel(p)} — ${SITE.name}`; }
      current = "#/collection"; break;
    }
    case "archive": html = archive(); title = `The Archive — ${SITE.name}`; tone = "taupe"; current = "#/archive"; break;
    case "about": html = about(); title = `About — ${SITE.name}`; current = "#/about"; break;
    case "care": html = care(); title = `Care — ${SITE.name}`; tone = "taupe"; current = "#/care"; break;
    case "contact": html = contact(); title = `Contact — ${SITE.name}`; current = "#/contact"; break;
    default: html = notFound(); title = `Not found — ${SITE.name}`;
  }

  main.classList.remove("in");
  setTimeout(() => {
    main.innerHTML = html;
    document.title = title;
    document.body.dataset.tone = tone;
    document.querySelectorAll("#nav a, #footNav a").forEach(a => {
      if (a.getAttribute("href") === current) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    window.scrollTo(0, 0);
    closeDrawer(true);
    setupPiece();
    requestAnimationFrame(() => { main.classList.add("in"); });
    main.focus({ preventScroll: true });
  }, main.innerHTML ? 180 : 0);
}

/* ---------- product interactions ---------- */
function setupPiece() {
  const bar = $("#claimBar");
  if (barObserver) { barObserver.disconnect(); barObserver = null; }
  bar.classList.remove("show"); bar.setAttribute("aria-hidden", "true"); bar.innerHTML = "";
  if (!currentProduct) return;
  const p = currentProduct;

  const g = $("#gallery");
  g.addEventListener("click", e => {
    const b = e.target.closest(".g-item");
    if (b) openLb(+b.dataset.i);
  });
  const counter = $("#gCount");
  g.addEventListener("scroll", () => {
    const first = g.firstElementChild;
    if (!first) return;
    const i = Math.round(g.scrollLeft / (first.offsetWidth + 8));
    counter.textContent = `${Math.min(i + 1, p.images.length)} / ${p.images.length}`;
  }, { passive: true });

  if (p.status === "AVAILABLE") {
    bar.innerHTML = `<span class="claim-bar__price">${price(p)}</span><a class="btn btn--solid" href="${claimUrl(p)}" target="_blank" rel="noopener">Claim this piece</a>`;
    const target = $("#buy");
    if (target && "IntersectionObserver" in window) {
      barObserver = new IntersectionObserver(([e]) => {
        const show = !e.isIntersecting;
        bar.classList.toggle("show", show);
        bar.setAttribute("aria-hidden", show ? "false" : "true");
      }, { threshold: 0 });
      barObserver.observe(target);
    }
  }
}

/* ---------- lightbox ---------- */
const lb = $("#lb");
let lbIndex = 0, lbTrigger = null;
function renderLb() {
  const p = currentProduct; if (!p) return;
  const img = p.images[lbIndex];
  $("#lbFrame").innerHTML = img.src
    ? `<img src="${img.src}" alt="${p.name}, ${img.alt}">`
    : `<div class="ph" role="img" aria-label="Image placeholder: ${img.label}"><span>${img.label}</span></div>`;
  $("#lbCap").textContent = `${img.label} · ${lbIndex + 1} / ${p.images.length}`;
}
function openLb(i) {
  lbIndex = i; lbTrigger = document.activeElement; renderLb();
  if (!lb.open) lb.showModal();
}
function stepLb(d) { const n = currentProduct.images.length; lbIndex = (lbIndex + d + n) % n; renderLb(); }
$("#lbClose").addEventListener("click", () => lb.close());
$("#lbPrev").addEventListener("click", () => stepLb(-1));
$("#lbNext").addEventListener("click", () => stepLb(1));
lb.addEventListener("close", () => { if (lbTrigger) lbTrigger.focus(); });
lb.addEventListener("click", e => { if (e.target === lb) lb.close(); });
lb.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") stepLb(-1);
  if (e.key === "ArrowRight") stepLb(1);
});

/* ---------- drawer ---------- */
const drawer = $("#drawer"), menuBtn = $("#menuBtn");
function openDrawer() {
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden", "false");
  menuBtn.setAttribute("aria-expanded", "true");
  document.body.style.overflow = "hidden";
  $("#drawerClose").focus();
}
function closeDrawer(silent) {
  if (!drawer.classList.contains("open")) return;
  drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true");
  menuBtn.setAttribute("aria-expanded", "false");
  document.body.style.overflow = "";
  if (!silent) menuBtn.focus();
}
menuBtn.addEventListener("click", openDrawer);
$("#drawerClose").addEventListener("click", () => closeDrawer());
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
drawer.addEventListener("click", e => { if (e.target.closest("a")) closeDrawer(true); });

/* ---------- boot ---------- */
const navHtml = (list) => list.map(([t, h]) => `<a href="${h}">${t}</a>`).join("");
$("#nav").innerHTML = navHtml(NAV);
$("#drawerNav").innerHTML = navHtml(FOOT);
$("#footNav").innerHTML = navHtml(FOOT);
$("#copy").textContent = `© ${new Date().getFullYear()} ${SITE.name}. All rights reserved.`;
$("#social").innerHTML = `<a href="${SITE.instagram}" target="_blank" rel="noopener">Instagram</a>`;
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
